<!DOCTYPE html>
<html lang=«ru»><head><meta charset=«utf-8»>
<meta name=«viewport» content=«width=device-width, initial-scale=1, viewport-fit=cover»>
<title>Приглашение — 23 января, кафе Заноза</title>
<link href=«https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Rubik:wght@400;500;700&display=swap» rel=«stylesheet»>
<style>
:root{—bg:#f1e9ff;—ink:#2f2a55;—pink:#ffb8d6;—blue:#cdbbff;—yellow:#c4f1de;—card:#ffffffd9;—btn:#2a2450;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=«light»]){—bg:#231f3d;—ink:#f1ecff;—card:#322c55e6}}
:root[data-theme=«dark»]{—bg:#231f3d;—ink:#f1ecff;—card:#322c55e6}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(—bg) linear-gradient(180deg,rgba(255,226,214,.7),rgba(241,233,255,0) 45%) no-repeat;min-height:100vh;color:var(—ink);font-family:Rubik,system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px;text-align:center}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px}.poster{display:block;width:100%;height:auto;cursor:zoom-in;border-radius:20px;box-shadow:0 14px 30px rgba(70,50,130,.2)}
.card{background:var(—card);border-radius:22px;padding:22px 16px;margin-top:22px;box-shadow:0 8px 22px rgba(70,50,130,.12);border:2px solid #fff}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.big{font-family:Unbounded,Rubik,sans-serif;font-size:clamp(18px,5.6vw,26px);line-height:1.1}
.lbl{font-size:14px;opacity:.75;margin-top:4px}
.cd{display:flex;justify-content:center;gap:10px;margin:22px 0 6px}
.cd div{min-width:64px;background:var(—blue);color:var(—btn);border-radius:16px;padding:10px 4px}
.cd b{display:block;font-family:Unbounded,Rubik,sans-serif;font-size:24px;font-weight:400}
.cd small{font-size:12px}
h2{font-family:Unbounded,Rubik,sans-serif;font-weight:700;font-size:22px;margin:30px 0 12px}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a.btn,button.btn{display:block;padding:14px 12px;border-radius:999px;font-weight:700;text-decoration:none;font-size:16px;color:var(—btn);background:var(—pink);border:0;cursor:pointer;font-family:inherit;text-align:center}
.btn.blue{background:var(—blue)}.btn.alt{background:var(—yellow);color:var(—btn)}.btn.blue{color:var(—btn)}
.btn:focus-visible{outline:3px solid var(—blue);outline-offset:3px}
.addr{margin:16px 0 0;font-size:16px;font-weight:500}.hint{font-size:13px;opacity:.7;line-height:1.4}#lb{position:fixed;inset:0;z-index:50;background:#000;display:none;align-items:center;justify-content:center;touch-action:pinch-zoom;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}#lb.on{display:flex}#lb .cap{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;text-align:center;color:#fff;font-size:14px;opacity:.85;pointer-events:none}#lb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}#lb button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#ffffffcc;font-size:22px;cursor:pointer}.foot{margin-top:26px;font-size:14px;opacity:.7}
#wishes{display:none}
body.w #main{display:none}body.w #wishes{display:block}
.back{display:inline-block;margin:0 0 8px;background:none;border:0;color:var(—ink);font:700 16px Rubik,sans-serif;cursor:pointer;padding:8px 0}
.wishes h1{font-family:Unbounded,Rubik,sans-serif;font-weight:700;font-size:clamp(26px,8vw,38px);line-height:1.1;margin:8px 0 18px}
.w1{display:flex;gap:14px;align-items:center;background:var(—card);border-radius:20px;padding:16px 18px;margin:12px 0;text-align:left;box-shadow:0 6px 16px rgba(70,50,130,.1);border:0;font-size:17px;line-height:1.45}
